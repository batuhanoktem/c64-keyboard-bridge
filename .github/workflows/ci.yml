name: Native checks and release artifacts

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release after all checks (the tag must already point to this commit)
        type: boolean
        default: false
      release_tag:
        description: Existing version tag for a manually published release, for example v0.1.0
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  c64-templates:
    name: Pinned C64 PRG build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build both unconfigured PRGs with pinned cc65
        run: scripts/build-prgs.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: c64-unconfigured-prgs
          path: |
            target/c64-prgs/KEYBRIDGE.PRG
            target/c64-prgs/NETWORKTEST.PRG
            target/c64-prgs/prg-manifest.json
          if-no-files-found: error
          retention-days: 14

  native:
    name: ${{ matrix.target }}
    needs: c64-templates
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            macos_minimum: "11.0"
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            macos_minimum: "10.15"
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Preserve source byte hashes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set macOS deployment minimum
        if: runner.os == 'macOS'
        env:
          MACOS_MINIMUM: ${{ matrix.macos_minimum }}
        run: printf 'MACOSX_DEPLOYMENT_TARGET=%s\n' "$MACOS_MINIMUM" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain and runtime notices
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt,rust-docs
      - name: Verify native toolchain target
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          actual="$(rustc -vV | sed -n 's/^host: //p')"
          [[ "$actual" == "$EXPECTED_TARGET" ]]
      - if: runner.os == 'Windows'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: c64-unconfigured-prgs
          path: target/ci-prgs
      - name: Install Linux GUI build and isolated acceptance dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev xvfb xauth x11-xkb-utils x11-utils libx11-6 libgl1-mesa-dri dbus-x11 python3-dbus python3-gi
      - name: Native Rust checks and recording CLI smoke
        env:
          C64_PRG_DIR: ${{ github.workspace }}/target/ci-prgs
        run: |
          if [[ "${OS:-}" == "Windows_NT" ]]; then
            scripts/check.sh --host-only
          else
            scripts/check.sh
          fi
      - name: Native XTEST acceptance on a private authenticated Xvfb display
        if: runner.os == 'Linux'
        run: python3 scripts/x11-smoke.py --binary target/debug/c64bridge
      - name: Real GUI under isolated Xvfb and StatusNotifier fixture
        if: runner.os == 'Linux'
        run: python3 scripts/gui-smoke.py --binary target/debug/c64bridge-gui
      - name: Retain isolated GUI layout evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gui-smoke-${{ matrix.target }}
          path: target/gui-smoke/*
          if-no-files-found: error
          retention-days: 14
      - name: Package both frontends, native installers, notices and verified PRGs
        env:
          C64_PRG_DIR: ${{ github.workspace }}/target/ci-prgs
        run: scripts/package.sh --binary-only
      - name: Verify isolated native installer install/extraction and uninstall
        run: python scripts/installer-smoke.py target/dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.target }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 14

  source:
    name: Matching corresponding source
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Package all locked crate sources and exact cc65 source
        run: scripts/package.sh --source-only
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-source
          path: target/dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish explicitly triggered version release
    needs: [native, source]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          merge-multiple: true
          path: target/release-assets
      - name: Verify release tag and calculate all archive checksums
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_REF: ${{ github.ref_name }}
        run: |
          tag="$DISPATCH_TAG"
          if [[ "$EVENT_NAME" == "push" ]]; then tag="$TAG_REF"; fi
          expected="$(python3 -c 'import tomllib; print("v" + tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          [[ "$tag" == "$expected" ]]
          [[ "$(git rev-list -n 1 "$tag")" == "$(git rev-parse HEAD)" ]]
          printf 'RELEASE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
          python3 scripts/checksums.py target/release-assets
      - name: Publish binary archives and their matching source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(target/release-assets/*.tar.gz target/release-assets/*.zip target/release-assets/*.dmg target/release-assets/*.exe target/release-assets/*.deb target/release-assets/*.metadata.json target/release-assets/SHA256SUMS)
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes --title "$RELEASE_TAG"
