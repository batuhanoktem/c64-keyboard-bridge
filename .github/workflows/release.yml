name: Protected signed release preparation

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag on main (no tag is created), for example v0.1.0
        required: true
        type: string
      ci_run_id:
        description: Successful Native checks run for that exact tagged commit
        required: true
        type: string
      publish:
        description: Explicitly publish after signing, notarization and final download verification
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: protected-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate exact tag, five-platform CI and corresponding source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run credential-free release safety fixtures
        run: python3 scripts/release-tests.py
      - name: Download tested artifacts and verify every source and native hash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          python3 scripts/release.py fetch --tag "$RELEASE_TAG" --ci-run "$CI_RUN_ID" --inputs target/unsigned --identity target/release-identity.json
      - name: Retain verified public release identity for review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-release-identity
          path: target/release-identity.json
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Approve, sign and notarize both tested Mac architectures
    needs: validate
    runs-on: macos-15
    timeout-minutes: 120
    environment: macos-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Revalidate unsigned artifacts before exposing Apple credentials
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: python3 scripts/release.py fetch --tag "$RELEASE_TAG" --ci-run "$CI_RUN_ID" --inputs target/unsigned
      - name: Promote tested packages without building or executing their binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          MACOS_CERTIFICATE_FINGERPRINT: ${{ vars.MACOS_CERTIFICATE_FINGERPRINT }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          python3 scripts/release.py promote --tag "$RELEASE_TAG" --ci-run "$CI_RUN_ID" --inputs target/unsigned --output target/promoted --credentials-dir "$RUNNER_TEMP/c64-keyboard-bridge-signing"
      - name: Remove temporary credentials even after failure or cancellation
        if: always()
        run: python3 scripts/release.py cleanup --credentials-dir "$RUNNER_TEMP/c64-keyboard-bridge-signing"
      - name: Upload only public promoted assets after successful credential cleanup
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: notarized-macos-release
          path: |
            target/promoted/*.tar.gz
            target/promoted/*.dmg
            target/promoted/*.metadata.json
            target/promoted/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  upload:
    name: Prepare verified draft or explicitly publish
    needs: [validate, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: notarized-macos-release
          path: target/promoted
      - name: Revalidate retained Windows, Linux and source artifacts without Apple credentials
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: python3 scripts/release.py fetch --tag "$RELEASE_TAG" --ci-run "$CI_RUN_ID" --inputs target/unsigned
      - name: Upload, download and verify the final exact asset set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          publish=()
          if [[ "$PUBLISH" == "true" ]]; then publish=(--publish); fi
          python3 scripts/release.py upload --tag "$RELEASE_TAG" --ci-run "$CI_RUN_ID" --inputs target/unsigned --output target/promoted "${publish[@]}"
