[package]
name = "bridge-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bridge-protocol.workspace = true
bridge-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
dotenvy.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
reqwest.workspace = true
directories.workspace = true
getrandom.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
core-foundation = "0.10.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["xtest", "xkb"] }
libc = "0.2"
# remote_desktop's selected-device response references screencast::Stream.
# Enabling these API types does not request screen capture.
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
reis = { version = "=0.7.1", features = ["tokio"] }
xkbcommon-dl = "=0.4.2"
futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3.27"
